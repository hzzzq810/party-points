<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>党员发展积分管理系统 · 国际交流学院</title>
<script src="xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-brand"><h1>🏛 党员发展积分管理系统 <span class="tag">国际交流学院</span></h1></div>
  <div class="topbar-actions">
    <button type="button" class="topbar-unc hide" id="globalUncBadge" title="点击查看不确定项">待处理 0 项</button>
    <button class="btn btn-o" id="btnExport">📤 导出汇总</button>
    <span class="export-hint hide" id="exportHint"></span>
    <button class="btn btn-p" id="btnSaveAll">💾 保存</button>
    <div class="topbar-more">
      <button type="button" class="btn btn-o" id="btnMore">⋮ 更多</button>
      <div class="topbar-more-menu" id="topbarMoreMenu">
        <button class="btn" id="btnTpl">📥 下载模板</button>
        <button class="btn" id="btnBackup">📦 备份数据</button>
        <button class="btn" id="btnRestore" style="position:relative">📥 恢复数据<input type="file" id="restoreFile" accept=".json" style="position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer"></button>
        <button class="btn" id="btnLogout">🚪 退出登录</button>
      </div>
    </div>
  </div>
</div>
<div class="app">
<div class="sidebar">
<div class="sidebar-accent"></div>
<div class="sec">
  <input type="checkbox" id="foldUpload" class="sidebar-toggle" checked>
  <label for="foldUpload" class="sidebar-fold-label">上传与导入</label>
  <div class="sidebar-collapsible">
  <div class="up-box" id="dropZone">
    <div class="up-box-title">📤 上传信息收集表</div>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <button class="btn btn-p" id="btnProcess" disabled style="width:100%;margin-top:8px">开始处理</button>
    <div id="uploadMsg" style="margin-top:6px;font-size:12px"></div>
    <div class="mode-row"><label><input type="radio" name="uploadMode" value="append" checked> 追加合并</label><label><input type="radio" name="uploadMode" value="replace"> 替换全部</label></div>
    <div class="paste-zone" id="pasteZone">📋 或 Ctrl+V 粘贴表格</div>
  </div>
  </div>
</div>
<div class="sec">
  <input type="checkbox" id="foldMembers" class="sidebar-toggle" checked>
  <label for="foldMembers" class="sidebar-fold-label">成员列表 <span class="count" id="sideCount">0</span></label>
  <div class="sidebar-collapsible">
  <input type="text" class="search" id="searchMember" placeholder="🔍 搜索姓名或班级...">
  <div class="mlist" id="memberList"><div class="list-empty">暂无成员</div></div>
  <div class="member-actions">
    <button class="btn btn-s" id="btnAddMember" style="flex:1">➕ 添加</button>
    <button class="btn btn-d btn-s" id="btnClearAll" style="flex:1">🗑 清空</button>
  </div>
  <div class="sidebar-unc-hint hide" id="sideUncHint"></div>
  <button type="button" class="btn btn-b btn-s btn-link-crit" id="btnOpenCrit">📋 打开评分标准</button>
  </div>
</div>
</div>
<div class="main" id="mainContent">
<div class="page-shell">
<div class="empty-state" id="emptyState">
  <div class="icon">📂</div>
  <div class="empty-title">请先在左侧上传信息收集表</div>
  <div class="empty-desc">支持 Excel 批量导入 · 自动分类算分 · 评分标准可自定义</div>
</div>
<div class="main-content hide" id="viewSummary">
  <button class="btn btn-p" id="btnBackSummary" style="margin-bottom:14px">← 返回个人视图</button>
  <div class="mode-switch-bar" id="modeSwitchBar">
    <span class="mode-switch-label">视图模式：</span>
    <button class="mode-btn active" id="btnModeDetail">📋 明细模式</button>
    <button class="mode-btn" id="btnModeSimple">📊 简洁总分</button>
  </div>
  <div class="tbl-wrap"><table class="tbl" id="summaryTable"></table></div>
</div>
<div class="main-content hide" id="viewPersonal">
<div class="member-header">
  <span class="mh-name" id="mhName">—</span>
  <span class="mh-class" id="mhClass">—</span>
  <span style="flex:1"></span>
  <label><input type="checkbox" id="coefCb"> 前期×0.6</label>
  <button class="btn btn-p btn-s" id="btnExportDetail">📥 导出明细</button>
  <button class="btn btn-b btn-s" id="btnShowSummary">📊 查看汇总表</button>
</div>
<div class="score-section" id="scoreSection">
<div class="cards" id="scoreCards">
  <div class="card ca"><div class="cv" id="cAc">0</div><div class="cl">学业能力 ≤<span id="lblAcCap">40</span></div></div>
  <div class="card cp"><div class="cv" id="cPt">0</div><div class="cl">党性成长 ≤<span id="lblPtCap">60</span></div></div>
  <div class="card cd"><div class="cv" id="cDc">0</div><div class="cl">纪律约束</div></div>
  <div class="card ct"><div class="cv" id="cTot">0</div><div class="cl">总分 /100</div></div>
</div>
<div class="warn" id="warnBox"></div>
</div>
<div class="tabs" id="mainTabs">
  <div class="tab active" data-tab="overview">📊 积分总览</div>
  <div class="tab" data-tab="detail">📝 评分明细</div>
  <div class="tab" data-tab="uncertain">⚠️ 不确定项 <span class="badge" id="uncBadge">0</span></div>
  <div class="tab" data-tab="criteria">📋 评分标准</div>
</div>
<div id="panelOverview" class="tbl-wrap"><table class="tbl" id="scoreTable"></table></div>
<div id="panelDetail" class="hide"><div class="dgrid" id="detailGrid"></div></div>
<div id="panelUncertain" class="hide"><div id="uncList"></div></div>
<div id="panelCriteria" class="hide">
  <div class="criteria-toolbar">
    <button class="btn btn-p" id="btnSaveCrit">💾 保存修改并重算</button>
    <button class="btn btn-d" id="btnReset">↩ 恢复默认</button>
    <span class="crit-version" id="critVersionLabel">评分标准版本 v10</span>
  </div>
  <div class="crit-grid2" id="critPanel"></div>
</div>
</div>
</div>
</div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal-box" id="modalBox"></div></div>
<div class="login-bg" id="loginBg">
  <div class="login-box">
    <div class="login-logo">🏛</div>
    <div class="login-title">党员发展积分管理系统</div>
    <div class="login-sub">多设备数据同步 · 请输入共享密码</div>
    <input type="password" id="loginPwd" class="login-input" placeholder="共享密码" autocomplete="current-password">
    <button type="button" class="btn btn-p" id="btnLogin" style="width:100%;margin-top:12px">登录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="status hide" aria-hidden="true"><span id="statusBar">系统就绪 v10</span></div>
<script src="cloudbase.full.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('btnMore').addEventListener('click',function(e){e.stopPropagation();document.getElementById('topbarMoreMenu').classList.toggle('open');});
document.addEventListener('click',function(e){if(!e.target.closest('.topbar-more'))document.getElementById('topbarMoreMenu').classList.remove('open');});
</script>
</body>
</html>
